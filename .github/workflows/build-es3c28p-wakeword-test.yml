name: Build Terra firmware (wake word test)
# Experimental: Multinet custom wake word for the es3c28p-terra board.
# The wake-word options are written into a throw-away config file inside the
# CI checkout only; the board's committed config.json is not modified
# (docs/custom-board.md: wake words are user build options, not board config).
on:
  workflow_dispatch:
    inputs:
      wake_word:
        description: "Custom wake word, pinyin separated by spaces (Chinese Multinet)"
        default: "te er la"
      display:
        description: "Text sent to the server after wake word detection"
        default: "เทอร่า"
      threshold:
        description: "Threshold 1-99 (smaller = more sensitive)"
        default: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create throw-away board config with custom wake word
        env:
          WW: ${{ inputs.wake_word }}
          WW_DISPLAY: ${{ inputs.display }}
          WW_THRESHOLD: ${{ inputs.threshold }}
        run: |
          python3 - <<'PY'
          import json, os
          src = "main/boards/es3c28p-terra/config.json"
          dst = "main/boards/es3c28p-terra/config.wwtest.json"
          cfg = json.load(open(src, encoding="utf-8"))
          threshold = int(os.environ["WW_THRESHOLD"])
          assert 1 <= threshold <= 99
          extra = [
              "CONFIG_WAKE_WORD_DISABLED=n",
              "CONFIG_USE_ESP_WAKE_WORD=n",
              "CONFIG_USE_AFE_WAKE_WORD=n",
              "CONFIG_USE_CUSTOM_WAKE_WORD=y",
              "CONFIG_SR_MN_CN_NONE=n",
              "CONFIG_SR_MN_CN_MULTINET7_QUANT=y",
              'CONFIG_CUSTOM_WAKE_WORD="%s"' % os.environ["WW"],
              'CONFIG_CUSTOM_WAKE_WORD_DISPLAY="%s"' % os.environ["WW_DISPLAY"],
              "CONFIG_CUSTOM_WAKE_WORD_THRESHOLD=%d" % threshold,
          ]
          for b in cfg["builds"]:
              b["sdkconfig_append"] = list(b.get("sdkconfig_append", [])) + extra
          json.dump(cfg, open(dst, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(open(dst, encoding="utf-8").read())
          PY

      - name: Build firmware (ESP-IDF v6.1)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          command: python scripts/build.py es3c28p-terra -c config.wwtest.json --language th-TH

      - name: Show effective wake-word config
        run: |
          grep -E "CONFIG_(USE_CUSTOM_WAKE_WORD|USE_AFE_WAKE_WORD|CUSTOM_WAKE_WORD|SR_MN_|SR_WN_)" sdkconfig || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: terra-firmware-wwtest
          path: |
            build/**/*.bin
            releases/*.zip
            output/**/*.bin
          if-no-files-found: error

      - name: Publish merged-binary.bin as a pre-release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="terra-wwtest-${{ github.run_number }}"
          cp build/merged-binary.bin merged-binary.bin
          gh release create "$TAG" merged-binary.bin \
            --target "${{ github.sha }}" \
            --title "Terra wake-word TEST $TAG" \
            --notes "es3c28p-terra Multinet wake word test, from ${{ github.sha }}. Revert: flash the normal terra-fw release." \
            --prerelease
