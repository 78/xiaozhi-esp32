name: Build ESP32-C6 AI Terminal

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build Waveshare ESP32-C6 AI Terminal
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.0.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py \
            waveshare/esp32-c6-dev-kit-n16-ai-terminal \
            --name esp32-c6-dev-kit-n16-ai-terminal

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-esp32-c6-ai-terminal-${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
