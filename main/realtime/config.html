<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小智 · 设备设置</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#193139;font:15px/1.6 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:40px 20px}header{margin-bottom:28px}h1{font-size:27px;letter-spacing:-1px;margin:0}p,small{color:#657d83}section{border:1px solid #e0e9ec;background:white;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 5px 25px #25464f05}h2{font-size:18px;margin:0 0 8px}label{display:block;margin:16px 0 5px;font-weight:550}input:not([type=checkbox]),select{width:100%;border:1px solid #cbd9dc;border-radius:9px;padding:11px;font:inherit;background:white;color:inherit}input:focus,select:focus{outline:2px solid #83bdb5}button{font:inherit;border:0;border-radius:9px;background:#176b66;color:white;padding:11px 18px;cursor:pointer;margin-top:18px}button:disabled{opacity:.5}.secondary{background:#eaf1f3;color:#193139}summary{cursor:pointer;color:#657d83;margin-top:20px}.status{min-height:24px;color:#176b66;margin-top:12px}.badge{background:#edf4f3;border-radius:20px;padding:4px 12px;font-size:12px;color:#176b66}footer{text-align:center;color:#657d83;font-size:12px}[hidden]{display:none!important}@media(max-width:520px){main{padding:24px 16px}section{padding:20px}}
</style><main><header><h1>小智 · 设备设置</h1><p>连接网络，选择你的语音服务</p></header>
<section><h2>网络连接 <span id="networkState" class="badge">读取中</span></h2><p>小智与阿里云共用一套 Wi-Fi 配置。</p><div id="lanNetwork" hidden><button type="button" class="secondary" id="provision">更换 Wi-Fi</button><p><small>将进入设备热点配网，请按屏幕提示重新连接。</small></p></div>
<form id="networkForm" hidden><label for="ssid">Wi-Fi 名称</label><input id="ssid" maxlength="32" list="networks" required autocomplete="off"><datalist id="networks"></datalist><button type="button" class="secondary" id="scan">刷新网络</button><label for="password">Wi-Fi 密码</label><input id="password" type="password" maxlength="64" autocomplete="new-password"><button id="connect">连接网络</button> <button type="button" id="exit" class="secondary" hidden>完成并连接</button></form><div id="networkStatus" class="status" role="status"></div></section>
<form id="serviceForm"><section><h2>语音服务 <span id="deviceState" class="badge">—</span></h2><label for="service">当前服务</label><select id="service"><option value="xiaozhi">小智</option><option value="aliyun">阿里云 Realtime</option></select>
<div id="xiaozhi"><label for="ota">小智 OTA 地址</label><input id="ota" type="url" maxlength="255" placeholder="留空使用默认服务" autocomplete="off"><small>服务器下发连接参数及激活信息。</small></div>
<div id="aliyun" hidden><label for="region">地域</label><select id="region"><option value="cn-beijing">北京</option><option value="ap-southeast-1">新加坡</option></select><label for="workspace">业务空间 ID</label><input id="workspace" maxlength="64" autocomplete="off"><label for="key">API Key <small id="keyState"></small></label><input id="key" type="password" maxlength="256" placeholder="留空保持已保存的密钥" autocomplete="new-password"><label><input id="clearKey" type="checkbox"> 清除已保存密钥</label></div>
<details><summary>高级与调试</summary><label for="wsUrl">阿里云 WebSocket / 本地代理地址</label><input id="wsUrl" maxlength="512" placeholder="留空直连阿里云" autocomplete="off"><label><input id="debugEnabled" type="checkbox"> 启用 Go Debug 采集</label><label for="debugAddress">采集地址</label><input id="debugAddress" maxlength="64" placeholder="tcp://192.168.1.20:7319"><label for="debugLevel">记录内容</label><select id="debugLevel"><option value="0">状态事件</option><option value="1">状态与协议原文</option><option value="2">状态、协议与音频</option></select><label><input id="debugInput" type="checkbox"> 记录 ES8311 原始输入音频</label><small>独立诊断通道记录，播放期间也可采集。</small></details>
<p><small id="activeService"></small></p><button id="save" disabled>保存服务配置</button><div id="serviceStatus" class="status" role="status"></div><small>保存后重启生效。两套服务参数分别保留。</small></section></form><section><h2>声音</h2><label for="volume">播放音量 <output id="volumeValue">—</output></label><input type="range" id="volume" min="0" max="100"><button type="button" class="secondary" id="saveVolume">设置音量</button><div id="volumeStatus" class="status" role="status"></div></section><section><details><summary>设备信息</summary><p id="info"></p><button type="button" class="secondary" id="restart">重启设备</button></details><div id="connection" class="status" role="status">正在读取设备…</div></section><footer>Manual / Auto：双击设备 BOOT 按钮切换</footer></main>
<script>
const $=id=>document.getElementById(id),portal=location.hostname==='192.168.4.1'&&location.port!=='81',base=portal?'http://192.168.4.1:81':'';let loaded=false;
const request=async(path,options={})=>{const r=await fetch(path,{cache:'no-store',...options});if(!r.ok)throw Error('请求失败（'+r.status+'）');return r.json()},json=(method,data)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
function showService(){$('aliyun').hidden=$('service').value!=='aliyun';$('xiaozhi').hidden=!$('aliyun').hidden}$('service').onchange=showService;
async function load(){try{const c=await request(base+'/api/config');$('networkState').textContent=c.provisioning?'热点配网':(c.ssid||'Wi-Fi')+' · '+(c.wifi_connected?'已连接':'已断开');$('networkForm').hidden=!c.provisioning;$('lanNetwork').hidden=c.provisioning;$('service').value=c.selected?'aliyun':'xiaozhi';$('region').value=c.region;$('workspace').value=c.workspace_id;$('ota').value=c.xiaozhi_ota_url||'';$('wsUrl').value=c.websocket_url||'';$('keyState').textContent=c.api_key_set?'已配置':'未配置';$('debugEnabled').checked=c.debug_enabled;$('debugInput').checked=c.debug_input_pcm;$('debugAddress').value=c.debug_address;$('debugLevel').value=c.debug_level;$('deviceState').textContent=(c.device_state||'')+' · '+(c.mode||'auto');$('info').textContent=c.board+' · '+c.firmware+' · '+c.device_id;$('volume').value=c.volume;$('volumeValue').textContent=c.volume;$('activeService').textContent='已保存的服务：'+(c.selected?'阿里云':'小智')+'（重启后应用）';$('connection').textContent='网页已连接设备';$('save').disabled=false;showService();loaded=true;if(c.provisioning)scan()}catch(e){$('serviceStatus').textContent='读取配置失败，请刷新页面：'+e.message}}load();
async function scan(){try{const c=await request('/scan');$('networks').replaceChildren();for(const ap of c.aps||[]){const o=document.createElement('option');o.value=ap.ssid;$('networks').append(o)}}catch(e){$('networkStatus').textContent=e.message}}$('scan').onclick=scan;
$('networkForm').onsubmit=async e=>{e.preventDefault();$('connect').disabled=true;$('networkStatus').textContent='正在验证网络连接…';try{const c=await request('/submit',json('POST',{ssid:$('ssid').value,password:$('password').value}));if(!c.success)throw Error('连接失败，请检查名称和密码');$('password').value='';$('networkStatus').textContent='网络验证成功。请先保存服务配置，再点击完成。';$('exit').hidden=false}catch(err){$('networkStatus').textContent=err.message}finally{$('connect').disabled=false}};
$('exit').onclick=async()=>{try{await request('/exit',{method:'POST'});$('networkStatus').textContent='设备正在连接，请查看屏幕上的地址。'}catch(e){$('networkStatus').textContent='请查看设备屏幕确认连接状态。'}};
$('provision').onclick=async()=>{try{await request(base+'/api/network/provision',{method:'POST'});$('networkStatus').textContent='已请求进入配网。请连接屏幕提示的设备热点。'}catch(e){$('networkStatus').textContent=e.message}};
$('serviceForm').onsubmit=async e=>{e.preventDefault();if(!loaded)return;$('save').disabled=true;$('serviceStatus').textContent='保存中…';try{await request(base+'/api/config',json('PUT',{selected:$('service').value==='aliyun',xiaozhi_ota_url:$('ota').value.trim(),region:$('region').value,workspace_id:$('workspace').value.trim(),api_key:$('key').value,clear_api_key:$('clearKey').checked,websocket_url:$('wsUrl').value.trim(),debug_enabled:$('debugEnabled').checked,debug_address:$('debugAddress').value.trim(),debug_level:Number($('debugLevel').value),debug_input_pcm:$('debugInput').checked}));$('keyState').textContent=$('clearKey').checked?'未配置':($('key').value?'已配置':$('keyState').textContent);$('key').value='';$('clearKey').checked=false;$('serviceStatus').textContent='已保存，请重启设备生效。'}catch(err){$('serviceStatus').textContent=err.message}finally{$('save').disabled=false}};
$('volume').oninput=()=>$('volumeValue').textContent=$('volume').value;
$('saveVolume').onclick=async()=>{try{await request(base+'/api/volume?value='+$('volume').value,{method:'POST'});$('volumeStatus').textContent='已请求设置音量'}catch(e){$('volumeStatus').textContent=e.message}};
$('restart').onclick=async()=>{try{await request(base+'/api/restart',{method:'POST'});$('connection').textContent='设备重启中，请稍后刷新'}catch(e){$('connection').textContent=e.message}};
setInterval(async()=>{try{const c=await request(base+'/api/config');$('connection').textContent='网页已连接设备';$('save').disabled=!loaded;$('deviceState').textContent=c.device_state+' · '+c.mode}catch(e){$('connection').textContent='设备已断开，正在等待重连';$('save').disabled=true}},5000);
</script></html>
